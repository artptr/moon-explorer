# Build, test, and do a check of the plugin. Then prepare a draft release.
# - The job 'build' makes the plugin ZIP file with the 'buildPlugin' task. The job uploads the file as a workflow artifact.
# - The job 'test' runs the 'check' task. If a test fails, the job uploads the test reports.
# - The Plugin Verifier job runs the 'verifyPlugin' task and uploads the Plugin Verifier reports.
#   A pull request does a check against two IDEs only: the IDE of the build and the newest released IDE. A push to 'main' does a check against all recommended IDEs.
#
# The jobs 'build' and 'test' and the Plugin Verifier job run in parallel. On a push to 'main', the job 'releaseDraft' creates a draft GitHub release after these three jobs pass.
#
# A push to 'main' and a pull request start the workflow.
# A change to documentation only does not start the workflow. Refer to the 'paths' filters below.
#
# GitHub Actions reference: https://docs.github.com/actions
#

name: Build
on:
  # Only a push to 'main' starts a push run. Thus a commit on a pull request branch starts only one run.
  push:
    branches: [ main ]
    # The workflow does not start if the change has only documentation files.
    # You cannot add files back to a 'paths-ignore' filter. Thus the filter uses 'paths' with '!' patterns.
    # A later pattern has priority over an earlier pattern. The Gradle build reads CHANGELOG.md. Thus the filter includes CHANGELOG.md.
    # The filter includes 'src/**' again. Thus a future Markdown file in 'src/' also starts the workflow.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.vale/**'
      - '!.vale.ini'
      - '!.claude/**'
      - 'CHANGELOG.md'
      - 'src/**'
  # A pull request starts the workflow if it changes a file in the 'paths' filter.
  pull_request:
    # Use the same 'paths' filter as for 'push'.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!.vale/**'
      - '!.vale.ini'
      - '!.claude/**'
      - 'CHANGELOG.md'
      - 'src/**'

# Give the GITHUB_TOKEN read access only. Jobs that write data set their own permissions.
permissions:
  contents: read

# A new commit on a pull request cancels the previous run of the pull request.
# On main, the runs occur in sequence. If GitHub cancels the job 'releaseDraft' between its steps, the repository has no draft release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Make the plugin ZIP file.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

      # Show the available disk space. The job does not remove files to get more disk space before the build.
      - name: Show Available Disk Space
        if: ${{ always() }}
        run: df -h /

  # Run the tests.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      # The action writes the cache only on 'main'. Thus only 'main' puts the test dependencies into the cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run Tests
        run: ./gradlew check

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Show the available disk space. The job does not remove files to get more disk space before the tests.
      - name: Show Available Disk Space
        if: ${{ always() }}
        run: df -h /

  # Use the IntelliJ Plugin Verifier to do a check of the plugin structure and of the compatibility with IDE versions.
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:

      # Only a push to 'main' does a check against all recommended IDEs. Thus only this check must have more disk space.
      - name: Maximize Build Space
        if: github.event_name != 'pull_request'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      # The job does not save the Gradle cache. If the 'Restore IDE Cache' step does not find the IDE cache, Gradle downloads the IDE archives into the Gradle home directory.
      # The archives are large. The job keeps the extracted IDEs in a separate cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # If the Gradle cache does not contain the Gradle distribution, the wrapper downloads it and writes the progress to the standard output.
      # This step downloads the distribution. Then the 'Get IDE Versions' step gets only the output of the Gradle task.
      - name: Download Gradle Distribution
        run: ./gradlew --version --quiet

      # Get the versions of the two IDEs for the quick check: the IDE of the build and the newest released IDE.
      # The 'printProductsReleases' task does not download the IDEs.
      - name: Get IDE Versions
        id: ides
        # The step keeps the Gradle output in a variable. Then the step reads the first line.
        # Do not send the Gradle output to 'head'. 'head' can close the pipe before Gradle completes. With 'pipefail', this causes a failure of the step.
        run: |
          set -euo pipefail
          PLATFORM_VERSION="$(sed -n 's/^platformVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          # 'platformVersion' must be a fixed version number, for example '2025.3.6.1' or the EAP build '261.12345.67'.
          # The IDE of a snapshot version, for example '261-EAP-SNAPSHOT', can change, but the cache key does not change. Then the IDE cache contains an old IDE.
          if [[ ! "$PLATFORM_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::'platformVersion' in gradle.properties must be a fixed version number. The value is '$PLATFORM_VERSION'."
            exit 1
          fi
          if ! RELEASES="$(./gradlew printProductsReleases -PquickVerification=true --quiet --console=plain)"; then
            printf '%s\n' "${RELEASES:-}"
            echo "::error::The Gradle task printProductsReleases did not complete."
            exit 1
          fi
          NEWEST_IDE="$(printf '%s\n' "$RELEASES" | sed -n '1p')"
          # The first line of the Gradle output must be the version of the newest released IDE, for example 'IU-2026.2.3'. If the first line of the Gradle output is a different text, for example a warning, the step stops with an error.
          if [[ ! "$NEWEST_IDE" =~ ^IU-[0-9]+(\.[0-9]+)+$ ]]; then
            printf '%s\n' "$RELEASES"
            echo "::error::The step cannot get the version of the newest released IDE. The first line of the Gradle output is '$NEWEST_IDE'."
            exit 1
          fi
          echo "minimum=IU-$PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
          echo "newest=$NEWEST_IDE" >> "$GITHUB_OUTPUT"

      # If the Gradle property 'intellijPlatformIdesCacheEnabled' is true, Gradle extracts the IDEs into '.intellijPlatform/ides/<IDE>'.
      # The cache contains only the two IDEs for the quick check. A cache for all recommended IDEs is too large.
      - name: Restore IDE Cache
        id: ide-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .intellijPlatform/ides/${{ steps.ides.outputs.minimum }}
            .intellijPlatform/ides/${{ steps.ides.outputs.newest }}
          # If you change the paths or the contents of the IDE cache, change 'v1' to the next number. Example: 'v2'.
          key: plugin-verifier-ides-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ides.outputs.minimum }}-${{ steps.ides.outputs.newest }}

      # For a pull request, the job does the quick check. The quick check uses two IDEs in offline mode. Refer to 'quickVerification' in build.gradle.kts.
      - name: Run Plugin Verification tasks
        env:
          QUICK_VERIFICATION: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew verifyPlugin -PquickVerification=$QUICK_VERIFICATION -Porg.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true

      # If the 'Restore IDE Cache' step did not find the IDE cache, save the IDE cache.
      # Only a push to 'main' saves the IDE cache. Thus the repository has only one IDE cache for each key.
      # The cache from 'main' is available to all pull requests.
      # If the cache service has a failure, the job continues.
      - name: Save IDE Cache
        if: github.event_name != 'pull_request' && steps.ide-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .intellijPlatform/ides/${{ steps.ides.outputs.minimum }}
            .intellijPlatform/ides/${{ steps.ides.outputs.newest }}
          key: ${{ steps.ide-cache.outputs.cache-primary-key }}

      # Upload the Plugin Verifier reports also if the check fails.
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

      # Show the available disk space. For a pull request, the job does not remove files to get more disk space before the check.
      - name: Show Available Disk Space
        if: ${{ always() }}
        run: df -h /

  # Create a draft release on the GitHub Releases page. A maintainer examines the draft and publishes it.
  # Then the 'Release' workflow starts.
  releaseDraft:
    name: Release draft
    if: github.event_name != 'pull_request'
    needs: [ build, test, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Get the version for the draft release from gradle.properties.
      # If a published release has this version, stop. After a release, a maintainer must set the version of the next release. Refer to section 8 of docs/development.md.
      - name: Get Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASED=$(gh api --paginate repos/{owner}/{repo}/releases \
            --jq ".[] | select(.draft == false and .tag_name == \"$VERSION\") | .tag_name")
          if [[ -n "$RELEASED" ]]; then
            echo "::error::A published release has the version $VERSION. In gradle.properties, set 'version' to the version of the next release."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Delete all draft releases. The next step creates a new draft for the newest version.
      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      # Create a draft release that is not public. The release notes come from the 'Unreleased' section of CHANGELOG.md.
      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=$RELEASE_NOTE

          gh release create $VERSION \
            --draft \
            --title $VERSION \
            --notes-file $RELEASE_NOTE
