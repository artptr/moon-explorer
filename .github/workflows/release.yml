# Publish the plugin when a maintainer publishes the draft release from the 'Build' workflow.
# The workflow must have these repository secrets: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# If the variable SKIP_MARKETPLACE_PUBLISH is 'true', the job signs the plugin, but does not publish it.
# For more information, refer to https://plugins.jetbrains.com/docs/intellij/plugin-signing.html.

name: Release
on:
  release:
    types: [ prereleased, released ]

permissions:
  contents: read

jobs:

  # Publish the plugin. Then open a pull request for CHANGELOG.md.
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Change the 'Unreleased' section of CHANGELOG.md to a section for this version. The text of the release becomes the new changelog entry.
      # If the release has no text, this step and the 'Create Pull Request' step do not run.
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      - name: Publish Plugin
        if: ${{ vars.SKIP_MARKETPLACE_PUBLISH != 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Sign the plugin, but do not publish it. Use this step for a version that a maintainer uploaded to Marketplace manually.
      # Marketplace accepts the first version of a new plugin only as a manual upload. Refer to the section 'Version that you uploaded manually' in docs/development.md.
      - name: Sign Plugin
        if: ${{ vars.SKIP_MARKETPLACE_PUBLISH == 'true' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # A maintainer sets the version of the next release on the branch of the pull request. Then the maintainer merges the pull request.
      # The text of the pull request tells these steps. Refer to section 8 in docs/development.md.
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DOCS: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/development.md#8-release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "chore: update changelog for $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body-file - \
            --label "$LABEL" \
            --head $BRANCH \
            <<EOF
          This pull request contains the patched \`CHANGELOG.md\` file for the \`$VERSION\` version.

          Before you merge this pull request:

          1. On this branch, set \`version\` in \`gradle.properties\` to the version of the next release. If you do not know it, use the next minor version after \`$VERSION\`.
          2. Push a commit with this change to this branch.

          The \`Build\` workflow uses this version for the next draft release. Refer to [section 8 of \`docs/development.md\`]($RELEASE_DOCS).
          EOF
