# Lint Markdown documentation against the STE rules in .vale/styles/STE.
# The allowlist in .vale.ini (refer to docs/ste/allowlist.md) excludes README.md and third-party texts.
name: Docs
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: STE check (Vale)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.24.0
          files: all
          fail_on_error: true
          filter_mode: nofilter
