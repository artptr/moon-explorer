# Find changes in the moon output when a new moon version is available. Refer to docs/development.md, section 4.3.
# - Install the newest moon 2.x in the test workspace.
# - Record the moon output again.
# - Run the tests with the recorded output.
# - If the recorded output changes, the record script fails, or the tests fail, create or update one issue.
#
# The workflow does not commit or push changes. Only a run on 'main' changes an issue.
#
# GitHub Actions reference: https://docs.github.com/actions
#

name: Moon output
on:
  schedule:
    # Each Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      moon-version:
        description: 'The version of @moonrepo/cli to install. The value "2" installs the newest moon 2.x.'
        required: true
        default: '2'
        type: string

# Give the GITHUB_TOKEN read access only. Jobs that write data set their own permissions.
permissions:
  contents: read

# The runs occur in sequence. Thus two runs do not create two issues.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  check:
    name: Record and test
    runs-on: ubuntu-latest
    # The limit stops a run that does not end, for example because an npm or Gradle command does not end.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # A scheduled run has no inputs. Then the job installs the newest moon 2.x.
      MOON_VERSION: ${{ inputs.moon-version || '2' }}
      # The job finds the open issue from a previous run by this label. Refer to .github/labels.yml.
      ISSUE_LABEL: moon-output
      ISSUE_TITLE: The moon output check found a change or a failure
      WORKSPACE: src/test/testData/workspace
      RECORDED: src/test/testData/moon
    steps:

      # Check out the current repository
      # The job does not push. Thus the job does not keep the GITHUB_TOKEN in .git/config, where npm packages and tests can read it.
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up Node.js and npm for the moon CLI
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # Set up the Java environment for the tests
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      # Set up Gradle
      # The job does not save the Gradle cache. Only the 'Build' workflow puts data into the cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Change package.json and package-lock.json to the new moon version. Then the record script installs this version.
      - name: Install moon
        id: install
        working-directory: ${{ env.WORKSPACE }}
        run: |
          set -euo pipefail
          npm install --save-exact --no-audit --no-fund "@moonrepo/cli@$MOON_VERSION"
          VERSION="$(node -p "require('./package.json').devDependencies['@moonrepo/cli']")"
          echo "version=moon $VERSION" >> "$GITHUB_OUTPUT"

      # If moon changes a command or an option that the script uses, the script fails. The Report step writes this failure in the issue.
      - name: Record moon output
        id: record
        continue-on-error: true
        run: scripts/record-test-data.sh

      # The file moon-version.txt changes for each new moon version. Thus the step does not include this file.
      # The step keeps the output of 'git status' in a variable. If 'git status' fails, 'set -e' stops the step.
      # A command substitution in a condition does not stop the step.
      - name: Find changes
        id: changes
        if: steps.record.outcome == 'success'
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain -- "$RECORDED" ":(exclude)$RECORDED/moon-version.txt")"
          if [[ -n "$STATUS" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Run the tests with the new recorded output
      # The test data is an input of the 'test' task. Thus Gradle does not use a cached result for changed test data. Refer to build.gradle.kts.
      - name: Run Tests
        id: tests
        if: steps.record.outcome == 'success'
        continue-on-error: true
        run: ./gradlew test

      # Keep the recorded output and the test reports. A maintainer can compare them with the test data.
      # A cancelled run does not upload, report, or fail on a change, because its results are not complete.
      # If the artifact service has a failure, the job continues.
      - name: Upload moon output
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-output
          path: |
            ${{ env.RECORDED }}
            ${{ github.workspace }}/build/reports/tests

      # Create an issue, or update the open issue from a previous run.
      # The issue text has a marker with the moon version. The step adds a comment only if the moon version changes.
      # Thus each new moon version causes one notification, not one notification each week.
      # A manual run on a different branch writes only the job summary. Thus the issue shows only the result for 'main'.
      - name: Report
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.install.outputs.version }}
          RECORD_RESULT: ${{ steps.record.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          OLD_VERSION="$(git show "HEAD:$RECORDED/moon-version.txt" | tr -d '\n')"

          {
            echo "| Item | Result |"
            echo "|------|--------|"
            echo "| Version of the test data | $OLD_VERSION |"
            echo "| New version | $NEW_VERSION |"
            echo "| Record script | $RECORD_RESULT |"
            echo "| Change in the recorded output | ${CHANGED:-unknown} |"
            echo "| Tests | ${TEST_RESULT:-skipped} |"
          } > "$RUNNER_TEMP/result.md"
          cat "$RUNNER_TEMP/result.md" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RECORD_RESULT" == "success" && "$CHANGED" == "false" && "$TEST_RESULT" == "success" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No change. The job does not create an issue."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The run is not on main. The job does not change an issue." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A GitHub issue text can have a maximum of 65536 characters. Thus the step writes only the first lines of the diff.
          # The step cuts the diff at the end of a line. Thus the step does not cut a UTF-8 character.
          # Each diff line starts with '+', '-', ' ', '@', or a letter. Thus a diff line cannot close the code block.
          # 'git diff' does not show a new file that Git does not track. Thus the step adds new files with '--intent-to-add'.
          git add --intent-to-add -- "$RECORDED"
          git diff -- "$RECORDED" > "$RUNNER_TEMP/recorded.diff"
          awk '{ size += length($0) + 1; if (size > 50000) exit; print }' "$RUNNER_TEMP/recorded.diff" > "$RUNNER_TEMP/short.diff"
          BODY="$RUNNER_TEMP/issue.md"
          {
            echo "<!-- moon-version: $NEW_VERSION -->"
            echo "The \`Moon output\` workflow installed **$NEW_VERSION**. The test data has the output of **$OLD_VERSION**."
            echo
            cat "$RUNNER_TEMP/result.md"
            echo
            echo "Workflow run: $RUN_URL"
            echo "The artifact \`moon-output\` of the run contains the recorded output and the test reports."
            echo
            echo "To update the test data, refer to \`docs/development.md\`, section 4.3."
            echo
            echo "The workflow replaces this text at each run. Write notes in comments."
            echo
            echo "### Changed files"
            echo
            echo '````'
            git diff --stat -- "$RECORDED"
            echo '````'
            echo
            echo "### Diff"
            echo
            if ! cmp -s "$RUNNER_TEMP/recorded.diff" "$RUNNER_TEMP/short.diff"; then
              echo "The diff is too long for the issue. The text shows only the first lines. The artifact contains all files."
              echo
            fi
            echo '````diff'
            cat "$RUNNER_TEMP/short.diff"
            echo '````'
          } > "$BODY"

          NUMBER="$(gh issue list --state open --label "$ISSUE_LABEL" --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "$NUMBER" ]]; then
            # The 'Labels' workflow creates the label from .github/labels.yml. This workflow can run before the 'Labels' workflow.
            # Thus the step also creates the label. Use the same color and description as in .github/labels.yml.
            gh label create "$ISSUE_LABEL" --color EDEDED --description "Issue from the Moon output workflow" --force
            ISSUE_URL="$(gh issue create --title "$ISSUE_TITLE" --label "type/chore,area/cli,$ISSUE_LABEL" --body-file "$BODY")"
          else
            PREVIOUS="$(gh issue view "$NUMBER" --json body --jq .body | sed -n 's/^<!-- moon-version: \(.*\) -->\r\{0,1\}$/\1/p')"
            gh issue edit "$NUMBER" --body-file "$BODY"
            if [[ "$PREVIOUS" != "$NEW_VERSION" ]]; then
              gh issue comment "$NUMBER" --body "The workflow found a change with $NEW_VERSION. The issue text shows the new result. Workflow run: $RUN_URL"
            fi
            ISSUE_URL="$(gh issue view "$NUMBER" --json url --jq .url)"
          fi
          echo "issue=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "Issue: $ISSUE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      # The run fails if it finds a change. Thus the list of workflow runs also shows the change.
      # A run that is not on 'main' also fails, but it does not change an issue. Then the message refers only to the job summary.
      - name: Fail on change
        if: ${{ !cancelled() && steps.report.outputs.found == 'true' }}
        env:
          NEW_VERSION: ${{ steps.install.outputs.version }}
          ISSUE_URL: ${{ steps.report.outputs.issue }}
        run: |
          if [[ -n "$ISSUE_URL" ]]; then
            echo "::error::The moon output changed, the record script failed, or the tests failed with $NEW_VERSION. Refer to $ISSUE_URL."
          else
            echo "::error::The moon output changed, the record script failed, or the tests failed with $NEW_VERSION. The run is not on main, thus it did not change an issue. Refer to the job summary."
          fi
          exit 1
