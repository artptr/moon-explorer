# Create or change the repository labels from .github/labels.yml. The workflow does not delete other labels.
name: Labels
on:
  push:
    branches: [ main ]
    paths: [ .github/labels.yml ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
