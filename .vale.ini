# Vale configuration: lint rules for ASD-STE100 Simplified Technical English (STE).
# Refer to docs/ste/guide.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = MoonExplorer

# Do not lint generated output or third-party files.
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

# Vale cannot find the comments in a YAML file. Thus Vale uses the Python parser for .yml files.
# The Python parser finds the '#' comments. Thus Vale examines only the comments, not the keys and values.
# Refer to docs/ste/guide.md, section 5.
[formats]
yml = py

[*.md]
BasedOnStyles = STE

[.github/workflows/*.yml]
BasedOnStyles = STE

# STE allowlist. These files use standard English.
# Keep this section the same as docs/ste/allowlist.md.
# LICENSE has no .md extension, so Vale does not lint it. It is listed to match the allowlist.
[{README.md,LICENSE}]
BasedOnStyles =
STE.SentenceLength = NO
STE.ParagraphLength = NO
STE.Passive = NO
STE.Words = NO
STE.Contractions = NO
STE.Modal = NO
STE.Ing = NO
STE.Latin = NO

# Claude Code makes a git worktree in .claude/worktrees/ for each separate session.
# Each worktree is a full copy of the repository. Do not lint these copies.
# This section is not a part of the STE allowlist. Keep it as the last section.
[.claude/worktrees/**]
BasedOnStyles = NONE
