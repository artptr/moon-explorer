# Vale configuration: lint rules for ASD-STE100 Simplified Technical English (STE).
# Refer to docs/ste/guide.md.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = MoonExplorer

# Do not lint generated output or third-party files.
IgnoredScopes = code, tt
SkippedScopes = script, style, pre, figure

[*.md]
BasedOnStyles = STE

# STE allowlist. These files use standard English.
# Keep this section the same as docs/ste/allowlist.md.
# LICENSE has no .md extension, so Vale does not lint it. It is listed to match the allowlist.
[{README.md,LICENSE}]
BasedOnStyles =
STE.SentenceLength = NO
STE.ParagraphLength = NO
STE.Passive = NO
STE.Words = NO
STE.Contractions = NO
STE.Modal = NO
STE.Ing = NO
STE.Latin = NO
