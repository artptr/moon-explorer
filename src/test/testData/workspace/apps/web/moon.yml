language: 'typescript'
layer: 'application'
stack: 'frontend'
tags: ['react', 'public']
project:
  title: 'Web shop'
  description: 'The public web shop.'
# This project does not inherit the global task format. It has a local task format.
# It inherits the global task typecheck with the ID tsc.
workspace:
  inheritedTasks:
    exclude: ['format']
    rename:
      typecheck: 'tsc'
tasks:
  dev:
    command: 'echo dev web'
    description: 'Start the development server.'
    options:
      persistent: true
      cache: false
  build:
    command: 'echo build web'
    description: 'Make the production bundle.'
    deps: ['ui:build', 'utils:build']
    # The command does not make dist. The output is optional. Thus moon does not stop with an error.
    outputs:
      - file: 'dist'
        optional: true
  preview:
    command: 'echo preview web'
    deps: ['build']
  # This project changes the inherited task lint. It adds the option --max-warnings 0.
  lint:
    args: ['--max-warnings', '0']
  # This local task has the same ID as the global task format that this project does not inherit.
  format:
    command: 'echo format web'
