language: 'typescript'
layer: 'application'
stack: 'backend'
tags: ['node', 'internal']
project:
  title: 'Job worker'
  description: 'The worker that runs background jobs.'
# This project renames two global tasks to one ID. Thus the task check inherits from the two global tasks.
workspace:
  inheritedTasks:
    rename:
      format: 'check'
      test: 'check'
tasks:
  start:
    command: 'echo start worker'
    options:
      persistent: true
      cache: false
  build:
    command: 'echo build worker'
    description: 'Compile the worker.'
    deps: ['db:build']
    # The command does not make dist. The output is optional. Thus moon does not stop with an error.
    outputs:
      - file: 'dist'
        optional: true
