language: 'typescript'
layer: 'application'
stack: 'backend'
tags: ['node', 'public']
project:
  title: 'Shop API'
  description: 'The HTTP API of the shop.'
tasks:
  start:
    command: 'echo start api'
    description: 'Start the API server.'
    deps: ['db:migrate']
    options:
      persistent: true
      cache: false
  build:
    command: 'echo build api'
    deps: ['db:build', 'utils:build']
    # The command does not make dist. The output is optional. Thus moon does not stop with an error.
    outputs:
      - file: 'dist'
        optional: true
