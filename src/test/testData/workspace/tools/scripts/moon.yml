# This project has no stack value and no layer value. moon gives the value "unknown" for both.
project:
  title: 'Release scripts'
  description: 'Scripts for the release of the shop.'
# This project inherits only the global task lint. It does not inherit the global task format.
workspace:
  inheritedTasks:
    include: ['lint']
tasks:
  changelog:
    command: 'echo changelog'
    description: 'Make the changelog for the next release.'
    options:
      cache: false
