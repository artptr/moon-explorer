# Only backend projects inherit these tasks.
inheritedBy:
  stacks: ['backend']
tasks:
  test:
    command: 'echo test backend'
    description: 'Run the unit tests in Node.js.'
  audit:
    command: 'echo audit'
    description: 'Do a check of the dependencies for known vulnerabilities.'
  # This task has the same ID as a task in all.yml. Backend projects inherit the task from the two files.
  lint:
    command: 'echo lint backend'
