language: 'typescript'
layer: 'library'
stack: 'frontend'
tags: ['react']
project:
  title: 'UI components'
  description: 'Shared React components.'
tasks:
  build:
    command: 'echo build ui'
    # The command does not make dist. The output is optional. Thus moon does not stop with an error.
    outputs:
      - file: 'dist'
        optional: true
  storybook:
    command: 'echo storybook'
    description: 'Start Storybook for the components.'
    options:
      persistent: true
      cache: false
  # An internal task. moon does not write internal tasks in the key "tasks" in the output of "moon query projects".
  generate-icons:
    command: 'echo generate icons'
    description: 'Make the icon components from the SVG files.'
    options:
      internal: true
