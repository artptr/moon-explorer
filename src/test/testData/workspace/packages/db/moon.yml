language: 'typescript'
layer: 'library'
stack: 'backend'
tags: ['node', 'shared']
project:
  title: 'Database'
  description: 'The database schema and the database client.'
tasks:
  build:
    command: 'echo build db'
    # The command does not make dist. The output is optional. Thus moon does not stop with an error.
    outputs:
      - file: 'dist'
        optional: true
  migrate:
    command: 'echo migrate'
    description: 'Run the database migrations.'
    options:
      cache: false
