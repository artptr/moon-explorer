group = io.github.artptr.moonexplorer
version = 0.2.0

pluginRepositoryUrl = https://github.com/artptr/moon-explorer

# This is the IntelliJ Platform version for the build and the tests. The Build workflow uses it in the key of the IDE cache.
platformVersion = 2025.3.6.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
